<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Aura · app personal de bienestar integral de Carolina. Versión PWA (GitHub Pages + Supabase), basada en la versión 18 del artefacto.
     Versión 22 (25 oct 2026): código dividido en estilos.css y js/ (un archivo por área) y foto de comida con IA gratis (Gemini).
     31 oct 2026: avisos (notificaciones push) en js/avisos.js; sw.js los muestra.
     «Mi día» sigue siendo el nombre de la pantalla principal. -->
<title>Aura</title>
<meta name="apple-mobile-web-app-title" content="Aura">
<meta name="application-name" content="Aura">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F1FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15111F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Reinicio base (antes lo ponía el servicio de artefactos): márgenes del iPhone arriba y abajo. -->
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Navegación principal">
  <button class="tab" type="button" data-act="view" data-v="dia" id="tab-dia"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Mi día</button>
  <button class="tab" type="button" data-act="view" data-v="salud" id="tab-salud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Salud</button>
  <button class="plus" type="button" data-act="sheet" data-s="menu" aria-label="Registro rápido"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" type="button" data-act="view" data-v="cuerpo" id="tab-cuerpo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19l7-7"/></svg>Cuerpo</button>
  <button class="tab" type="button" data-act="view" data-v="fin" id="tab-fin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 8l12-3.5V6"/><path d="M15 12.5h5"/></svg>Finanzas</button>
</nav>

<div class="scrim" id="scrim" data-act="close" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Registro rápido" hidden></div>
<div id="toast" role="status"></div>

<!-- Código de Aura, dividido por áreas (versión 22). El orden importa: inicio.js va al final. -->
<script src="js/base.js"></script>
<script src="js/catalogos.js"></script>
<script src="js/datos.js"></script>
<script src="js/nube.js"></script>
<script src="js/organizador.js"></script>
<script src="js/calendario-pasos.js"></script>
<script src="js/mi-dia.js"></script>
<script src="js/salud.js"></script>
<script src="js/cuerpo.js"></script>
<script src="js/finanzas.js"></script>
<script src="js/registro.js"></script>
<script src="js/foto-ia.js"></script>
<script src="js/avisos.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
